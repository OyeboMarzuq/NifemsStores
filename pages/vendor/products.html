<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - NifemsStore</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/vendor.css">
</head>
<body>
    <div id="header-container"></div>

    <div class="vendor-container" style="display: flex; min-height: calc(100vh - 200px);">
        <!-- Sidebar -->
        <aside class="vendor-sidebar" id="sidebar-container"></aside>

        <!-- Main Content -->
        <main class="vendor-content">
            <div class="vendor-header">
                <h1>Products</h1>
                <a href="/pages/vendor/add-product.html" class="btn btn-primary">Add New Product</a>
            </div>

            <!-- Filters -->
            <div class="orders-filters" style="margin-bottom: 20px;">
                <div class="filter-group">
                    <select id="status-filter">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="draft">Draft</option>
                    </select>
                </div>

                <div class="filter-group">
                    <select id="category-filter">
                        <option value="">All Categories</option>
                        <option value="electronics">Electronics</option>
                        <option value="fashion">Fashion</option>
                        <option value="home">Home & Garden</option>
                    </select>
                </div>

                <div class="filter-group">
                    <input type="search" id="search-products" placeholder="Search products...">
                </div>
            </div>

            <!-- Products Table -->
            <div class="products-section">
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Sales</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="footer-container"></div>

    <script type="module" src="../../js/components/header.js"></script>
    <script type="module" src="../../js/components/footer.js"></script>
    <script type="module" src="../../js/pages/vendor/sidebar.js"></script>
    <script type="module" src="../../js/pages/vendor/products.js"></script>
</body>
</html>
