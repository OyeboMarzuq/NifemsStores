<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your NifemsStore account - Join our marketplace community">
  <title>Register - NifemsStore</title>
  
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">🛍️</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join NifemsStore today</p>
      </div>

      <!-- Alert Messages -->
      <div id="alert-container"></div>

      <!-- Step Indicators -->
      <div class="reg-steps">
        <div class="reg-step-indicator active">
          <div class="reg-step-number">1</div>
          <div class="reg-step-label">Account</div>
        </div>
        <div class="reg-step-indicator">
          <div class="reg-step-number">2</div>
          <div class="reg-step-label">Details</div>
        </div>
        <div class="reg-step-indicator">
          <div class="reg-step-number">3</div>
          <div class="reg-step-label">Confirm</div>
        </div>
      </div>

      <!-- Registration Form -->
      <form id="register-form" class="auth-form" novalidate>
        
        <!-- Step 1: Account Info -->
        <div class="reg-step active" data-step="1">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your@email.com"
              required
            >
            <span class="form-error" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a strong password"
              required
            >
            <div class="password-strength">
              <div class="strength-meter">
                <div class="strength-bar" id="strength-bar"></div>
              </div>
              <span class="strength-text" id="strength-text">Weak</span>
            </div>
            <span class="form-error" id="password-error"></span>
            <p class="form-help">At least 8 characters with uppercase, lowercase, and numbers</p>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
            >
            <span class="form-error" id="confirm-password-error"></span>
          </div>

          <div class="form-group">
            <label for="account-type">Account Type</label>
            <select id="account-type" name="accountType" required>
              <option value="">Select account type</option>
              <option value="customer">Customer - Buy products</option>
              <option value="vendor">Vendor - Sell products</option>
            </select>
            <span class="form-error" id="account-type-error"></span>
          </div>
        </div>

        <!-- Step 2: Personal Details -->
        <div class="reg-step" data-step="2">
          <div class="form-row">
            <div class="form-group">
              <label for="first-name">First Name</label>
              <input
                type="text"
                id="first-name"
                name="firstName"
                placeholder="John"
                required
              >
              <span class="form-error" id="first-name-error"></span>
            </div>

            <div class="form-group">
              <label for="last-name">Last Name</label>
              <input
                type="text"
                id="last-name"
                name="lastName"
                placeholder="Doe"
                required
              >
              <span class="form-error" id="last-name-error"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+1 (555) 000-0000"
              required
            >
            <span class="form-error" id="phone-error"></span>
          </div>

          <div class="form-group">
            <label for="address">Street Address</label>
            <input
              type="text"
              id="address"
              name="address"
              placeholder="123 Main St"
              required
            >
            <span class="form-error" id="address-error"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="city">City</label>
              <input
                type="text"
                id="city"
                name="city"
                placeholder="New York"
                required
              >
              <span class="form-error" id="city-error"></span>
            </div>

            <div class="form-group">
              <label for="state">State/Province</label>
              <input
                type="text"
                id="state"
                name="state"
                placeholder="NY"
                required
              >
              <span class="form-error" id="state-error"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="zip">Postal Code</label>
              <input
                type="text"
                id="zip"
                name="zip"
                placeholder="10001"
                required
              >
              <span class="form-error" id="zip-error"></span>
            </div>

            <div class="form-group">
              <label for="country">Country</label>
              <input
                type="text"
                id="country"
                name="country"
                placeholder="United States"
                required
              >
              <span class="form-error" id="country-error"></span>
            </div>
          </div>
        </div>

        <!-- Step 3: Review & Confirm -->
        <div class="reg-step" data-step="3">
          <div class="form-group">
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" name="terms" required>
                I agree to the <a href="#" target="_blank">Terms of Service</a>
              </label>
              <span class="form-error" id="terms-error"></span>
            </div>
          </div>

          <div class="form-group">
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" name="privacy">
                I agree to the <a href="#" target="_blank">Privacy Policy</a>
              </label>
            </div>
          </div>

          <div class="form-group">
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" name="newsletter">
                Send me promotional emails and updates
              </label>
            </div>
          </div>

          <div class="card" style="margin-bottom: var(--spacing-lg); background-color: var(--gray-50);">
            <h4>Review your information</h4>
            <div id="review-info" style="font-size: var(--text-sm); color: var(--text-secondary);">
              <!-- Will be populated by JavaScript -->
            </div>
          </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="reg-navigation">
          <button type="button" class="reg-btn-prev" id="prev-btn" disabled>← Previous</button>
          <button type="button" class="reg-btn-next" id="next-btn">Next →</button>
        </div>
      </form>

      <!-- Footer -->
      <div class="auth-footer" style="margin-top: var(--spacing-lg);">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/pages/auth/register.js"></script>
</body>
</html>
