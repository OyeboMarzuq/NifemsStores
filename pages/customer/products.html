<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - NifemsStore</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/customer.css">
</head>
<body>
    <div id="header-container"></div>
    
    <main class="main-content">
        <!-- Hero Section -->
        <section class="hero-section" style="background: linear-gradient(135deg, var(--color-primary) 0%, #0C2D5C 100%);">
            <div class="hero-content">
                <h1 class="hero-title">Browse Our Products</h1>
                <p class="hero-subtitle">Find the best products from verified vendors</p>
            </div>
        </section>

        <!-- Filters and Products Container -->
        <div class="products-container">
            <!-- Sidebar Filters -->
            <aside class="filters-sidebar">
                <div class="filter-section">
                    <h3 class="filter-title">Search</h3>
                    <input 
                        type="text" 
                        id="search-input" 
                        class="search-input" 
                        placeholder="Search products..."
                    >
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Category</h3>
                    <div class="filter-options" id="category-filter">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Price Range</h3>
                    <div class="price-range-container">
                        <input 
                            type="range" 
                            id="price-min" 
                            class="price-slider" 
                            min="0" 
                            max="100000" 
                            value="0"
                        >
                        <input 
                            type="range" 
                            id="price-max" 
                            class="price-slider" 
                            min="0" 
                            max="100000" 
                            value="100000"
                        >
                        <div class="price-display">
                            <span id="price-min-display">₦0</span> - <span id="price-max-display">₦100,000</span>
                        </div>
                    </div>
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Rating</h3>
                    <div class="filter-options" id="rating-filter">
                        <label class="filter-checkbox">
                            <input type="checkbox" value="4" data-filter="rating">
                            <span>⭐⭐⭐⭐⭐ 5 Stars</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" value="3" data-filter="rating">
                            <span>⭐⭐⭐⭐ 4+ Stars</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" value="2" data-filter="rating">
                            <span>⭐⭐⭐ 3+ Stars</span>
                        </label>
                    </div>
                </div>

                <div class="filter-section">
                    <h3 class="filter-title">Vendor Status</h3>
                    <div class="filter-options" id="vendor-filter">
                        <label class="filter-checkbox">
                            <input type="checkbox" value="verified" data-filter="vendor-status">
                            <span>Verified Only</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" value="bestseller" data-filter="vendor-status">
                            <span>Best Sellers</span>
                        </label>
                    </div>
                </div>

                <button class="btn btn-secondary btn-block" id="clear-filters">Clear Filters</button>
            </aside>

            <!-- Products Grid -->
            <section class="products-grid-section">
                <!-- Sorting and View Options -->
                <div class="products-toolbar">
                    <div class="sort-container">
                        <label for="sort-select">Sort by:</label>
                        <select id="sort-select" class="sort-select">
                            <option value="newest">Newest</option>
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                            <option value="rating">Highest Rated</option>
                            <option value="popular">Most Popular</option>
                        </select>
                    </div>
                    <div class="view-options">
                        <button class="view-btn grid-view active" data-view="grid" title="Grid View">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <rect x="2" y="2" width="6" height="6"/>
                                <rect x="12" y="2" width="6" height="6"/>
                                <rect x="2" y="12" width="6" height="6"/>
                                <rect x="12" y="12" width="6" height="6"/>
                            </svg>
                        </button>
                        <button class="view-btn list-view" data-view="list" title="List View">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <rect x="2" y="2" width="16" height="3"/>
                                <rect x="2" y="8" width="16" height="3"/>
                                <rect x="2" y="14" width="16" height="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Results Count -->
                <div class="results-info">
                    <p>Showing <span id="results-count">0</span> products</p>
                </div>

                <!-- Products Grid -->
                <div class="products-grid" id="products-grid">
                    <!-- Populated by JavaScript -->
                </div>

                <!-- No Results -->
                <div class="no-results" id="no-results" style="display: none;">
                    <div class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M3 10h18M3 10a2 2 0 1 0 0-4h-.5M3 10l2.293 8.027A2 2 0 0 0 7.147 20h9.706a2 2 0 0 0 1.854-1.973L19 10M3 6h18m0 0a2 2 0 1 0 0-4h-.5"/>
                        </svg>
                        <h3>No products found</h3>
                        <p>Try adjusting your filters or search terms</p>
                        <button class="btn btn-primary" id="reset-search">Clear All Filters</button>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="pagination">
                    <!-- Populated by JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="/js/config.js"></script>
    <script src="/js/utils/api.js"></script>
    <script src="/js/utils/auth.js"></script>
    <script src="/js/utils/localStorage.js"></script>
    <script src="/js/utils/formatter.js"></script>
    <script src="/js/utils/validation.js"></script>
    <script src="/js/components/header.js"></script>
    <script src="/js/components/footer.js"></script>
    <script src="/js/pages/customer/products.js"></script>
</body>
</html>
