<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - NifemsStore</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/customer.css">
</head>
<body>
    <div id="header-container"></div>

    <main class="main-container">
        <div class="breadcrumb">
            <a href="/pages/customer/home.html">Home</a>
            <span>/</span>
            <span>Shopping Cart</span>
        </div>

        <div class="cart-container">
            <h1>Shopping Cart</h1>

            <div class="cart-content">
                <div class="cart-items-section">
                    <div id="empty-cart" class="empty-state" style="display: none;">
                        <p>Your cart is empty</p>
                        <a href="/pages/customer/products.html" class="btn btn-primary">Continue Shopping</a>
                    </div>

                    <div id="cart-items-container"></div>
                </div>

                <aside class="cart-summary">
                    <h2>Order Summary</h2>

                    <div class="summary-item">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>

                    <div class="summary-item">
                        <span>Shipping:</span>
                        <span id="shipping-cost">$0.00</span>
                    </div>

                    <div class="summary-item">
                        <span>Tax:</span>
                        <span id="tax-amount">$0.00</span>
                    </div>

                    <div class="promo-code">
                        <input type="text" id="promo-code" placeholder="Promo code">
                        <button id="apply-promo" class="btn btn-secondary">Apply</button>
                    </div>

                    <div class="summary-item discount" id="discount-item" style="display: none;">
                        <span>Discount:</span>
                        <span id="discount-amount">-$0.00</span>
                    </div>

                    <div class="summary-divider"></div>

                    <div class="summary-item total">
                        <span>Total:</span>
                        <span id="total-price">$0.00</span>
                    </div>

                    <button id="checkout-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 20px;">
                        Proceed to Checkout
                    </button>

                    <a href="/pages/customer/products.html" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">
                        Continue Shopping
                    </a>
                </aside>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="../../js/components/header.js"></script>
    <script type="module" src="../../js/components/footer.js"></script>
    <script type="module" src="../../js/pages/customer/cart.js"></script>
</body>
</html>
